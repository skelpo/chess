# tuichess.dev: the site. api.tuichess.dev: the online chess server (Perry native, 127.0.0.1:8787).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuichess.dev;

    ssl_certificate /etc/letsencrypt/live/tuichess.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuichess.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tuichess.dev;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The high scores for the page, same origin.
    location = /api/leaderboard {
        proxy_pass http://127.0.0.1:8787/v1/leaderboard;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tuichess.dev;

    ssl_certificate /etc/letsencrypt/live/tuichess.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuichess.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tuichess.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.tuichess.dev;

    ssl_certificate /etc/letsencrypt/live/tuichess.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuichess.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaced, not appended: the server rate-limits new usernames by the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long polls are held 25 s.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
