# Port 80 for every tuichess name: certificate challenges, then HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tuichess.com www.tuichess.com tuichess.dev www.tuichess.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/tuichess-acme;
    }

    location / {
        return 301 https://tuichess.dev$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tuichess.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/tuichess-acme;
    }

    location / {
        return 301 https://api.tuichess.dev$request_uri;
    }
}
