# tuichess.com is an alias: everything goes to tuichess.dev.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuichess.com www.tuichess.com;

    ssl_certificate /etc/letsencrypt/live/tuichess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuichess.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tuichess.dev$request_uri;
}
